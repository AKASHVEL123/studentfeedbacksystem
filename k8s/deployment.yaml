apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-feedback-api
  labels:
    app: student-feedback-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-feedback-api
  template:
    metadata:
      labels:
        app: student-feedback-api
    spec:
      containers:
        - name: student-feedback-api
          image: student-feedback-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
